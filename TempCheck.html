<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Check</title>

<style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        #output {
            color: #1e3a8a;
            font-weight: bold;
            font-size: 24px;
            padding: 20px;
            background-color: #e0f2fe;
            border: 2px solid #60a5fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
    </style>
    

</head>

<body>
    <p id="output"></p>


        <script>
        let temp = prompt("Please enter temperature in ℃.....");
        if (temp >= 40) {
            output = "It's too hot 🔥";
        }
        else if (temp < 39 && temp > 30) {
            output = "normal warm day☀️";
        }
        else if (temp > 20 && temp < 29) {
            output = "Pleasant weather🌤️";
        }
        else if (temp < 20) {
            output = "It's cold!!🧥"
        }

         document.getElementById("output").innerHTML=output;
        </script>

        </body>

</html >
